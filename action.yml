name: Lace Registry Check
description: Check the Lace registry artifacts a pull request changes, with no publish credential.

branding:
  icon: check-circle
  color: blue

inputs:
  token:
    description: >-
      A read-only Lace service token of the publishing organization
      (registry:read, no publish scope). Required for visibility org_private,
      where the check reads the organization's private registry; a public
      check needs none and sends none. Never pass the publish token: a pull
      request's Terraform could read it.
    required: false
    default: ''
  visibility:
    description: >-
      public or org_private: the registry visibility the manifests publish
      with. public asks the public registry, with no credential, which
      versions it holds and validates each module's lace.cloud/ children as
      the public registry resolves them, so an org-private child is refused.
      org_private asks as the token's organization and needs the token input.
    required: false
    default: public
  api-url:
    description: >-
      The Lace API whose registry and validator each changed manifest is
      checked against, and the one the token belongs to.
    required: false
    default: https://lace.cloud

runs:
  using: composite
  steps:
    - shell: bash
      env:
        LACE_TOKEN: ${{ inputs.token }}
        LACE_AUTH_URL: ${{ inputs.api-url }}
        VISIBILITY: ${{ inputs.visibility }}
        EVENT_NAME: ${{ github.event_name }}
        BASE: ${{ github.event.pull_request.base.sha }}
      run: "${GITHUB_ACTION_PATH}/check.sh"
